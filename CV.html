<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curriculum Vitae | Dr. Ali Hagverdiyev</title>
  
  <!-- Google Fonts for a scholarly pairing: Merriweather (Serif) + Inter (Sans-Serif) -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* University of Miami inspired refined palette */
      --primary-color: #005030;      /* Deep Institutional Green */
      --accent-color: #f47321;       /* Subtle Academic Orange Accent */
      --text-main: #222222;          /* High-contrast charcoal for readability */
      --text-muted: #555555;         /* Secondary metadata text */
      --bg-page: #f8f9fa;            /* Light off-white page background */
      --bg-card: #ffffff;            /* Crisp white content area */
      --border-light: #e2e8f0;       /* Subtle structural dividers */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.7;
      font-size: 16px;
    }

    /* Main Centered Container */
    .page-wrapper {
      max-width: 1050px;
      margin: 30px auto;
      background-color: var(--bg-card);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-light);
      border-top: 4px solid var(--accent-color);
    }

    /* Two-Column Faculty Layout */
    .content-grid {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      padding: 40px;
      gap: 45px;
    }

    /* Left Sidebar Navigation */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      border-right: 1px solid var(--border-light);
      padding-right: 25px;
    }

    .nav-list {
      list-style: none;
    }

    .nav-list li {
      margin-bottom: 8px;
    }

    .nav-list a {
      display: block;
      padding: 10px 14px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 500;
      font-size: 15px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .nav-list a:hover {
      background-color: #f0f4f2;
      color: var(--primary-color);
      padding-left: 18px;
    }

    .nav-list a.active {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    /* Right Main Content Area */
    .main-content {
      flex: 1;
      min-width: 0;
    }

    .faculty-header {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-light);
    }

    .faculty-name {
      font-family: 'Merriweather', Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 6px;
    }

    .faculty-title {
      font-size: 16px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .section-heading {
      font-family: 'Merriweather', Georgia, serif;
      font-size: 20px;
      color: var(--text-main);
      margin: 0;
    }

    .pdf-actions {
      display: flex;
      gap: 10px;
    }

    .btn-pdf {
      display: inline-block;
      padding: 7px 14px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-pdf-outline {
      color: var(--primary-color);
      background-color: #f8faf9;
      border: 1px solid var(--primary-color);
    }

    .btn-pdf-outline:hover {
      background-color: #f0f4f2;
    }

    .btn-pdf-solid {
      color: #ffffff;
      background-color: var(--primary-color);
      border: 1px solid var(--primary-color);
    }

    .btn-pdf-solid:hover {
      background-color: #003d24;
    }

    /* Embedded PDF Frame */
    .pdf-container {
      border: 1px solid var(--border-light);
      border-left: 4px solid var(--primary-color);
      border-radius: 5px;
      overflow: hidden;
      background-color: #f8faf9;
    }

    .pdf-viewer {
      display: block;
      width: 100%;
      height: 780px;
      border: none;
    }

    /* Footer */
    .site-footer {
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: var(--text-muted);
      background-color: #f8f9fa;
      border-top: 1px solid var(--border-light);
    }

    /* Mobile & Tablet Responsiveness */
    @media screen and (max-width: 768px) {
      .page-wrapper {
        margin: 0;
        border-radius: 0;
        border: none;
        border-top: 4px solid var(--accent-color);
      }

      .content-grid {
        flex-direction: column;
        padding: 25px;
        gap: 25px;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border-light);
        padding-right: 0;
        padding-bottom: 15px;
      }

      .nav-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .nav-list li {
        margin-bottom: 0;
      }

      .pdf-viewer {
        height: 550px;
      }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <!-- Main Layout -->
    <div class="content-grid">
      
      <!-- Left Sidebar Navigation -->
      <nav class="sidebar" aria-label="Faculty Navigation">
        <ul class="nav-list">
          <li><a href="index.html">Bio</a></li>
          <li><a href="OfficeHours.html">Office Hours</a></li>
          <li><a href="Publications.html">Publications</a></li>
          <li><a href="Conferences.html">Conferences</a></li>
          <li><a href="Teaching.html">Teaching</a></li>
          <li><a href="AMSChapter.html">AMS Chapter</a></li>
          <li><a href="CV.html" class="active">CV</a></li>
        </ul>
      </nav>

      <!-- Main CV Section -->
      <main class="main-content">
        <div class="faculty-header">
          <h1 class="faculty-name">Dr. Ali Hagverdiyev</h1>
          <p class="faculty-title">Lecturer, Department of Mathematics &bull; University of Miami</p>
        </div>

        <section class="cv-section">
          <div class="section-header-row">
            <h2 class="section-heading">Curriculum Vitae</h2>
            <div class="pdf-actions">
              <a href="CV_Git.pdf" target="_blank" class="btn-pdf btn-pdf-outline">Open in New Tab</a>
              <a href="CV_Git.pdf" download="CV_Git.pdf" class="btn-pdf btn-pdf-solid">Download PDF</a>
            </div>
          </div>

          <div class="pdf-container">
            <iframe
              src="CV_Git.pdf"
              class="pdf-viewer"
              title="Curriculum Vitae — Dr. Ali Hagverdiyev">
            </iframe>
          </div>
        </section>
      </main>

    </div>

    <!-- Clean Institutional Footer -->
    <footer class="site-footer">
      &copy; Dr. Ali Hagverdiyev &bull; Department of Mathematics, University of Miami
    </footer>
  </div>

</body>
</html>
